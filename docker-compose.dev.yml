services:
  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      POSTGRES_USER: ${PostgreUser}
      POSTGRES_PASSWORD: ${PostgrePassword}
      POSTGRES_DB: ${PostgreName}
    ports:
      - "${PostgrePort}:${PostgrePort}"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - Network
    healthcheck:
      test : ["CMD-SHELL", "pg_isready -U ${PostgreUser} -d ${PostgreName}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "${Backend_Port}:${Backend_Port}"
    environment:
      - PostgreUser=${PostgreUser}
      - PostgrePassword=${PostgrePassword}
      - PostgreHost=${PostgreHost}
      - PostgrePort=${PostgrePort}
      - PostgreName=${PostgreName}
      - BACKEND_PORT=${Backend_Port}
      - FRONTEND_URL=${Frontend_URL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app:Z 
    depends_on:
      database:
        condition: service_healthy
    networks:
      - Network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${Frontend_Port}:${Frontend_Port}"
    environment:
      VITE_API_URL: ${Backend_API_URL}
      Frontend_Port: ${Frontend_Port}
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    networks:
      - Network

volumes:
  db:

networks:
  Network: