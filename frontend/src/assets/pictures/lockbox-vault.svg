<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" fill="none">
  <title>LockBox — vos secrets glissent dans le coffre</title>
  <defs>
    <style>@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2');}</style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="safeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454F5F"/>
      <stop offset="1" stop-color="#313944"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8694A7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8694A7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="680" height="380" rx="14" fill="#1E2329"/>
  <rect width="680" height="380" rx="14" fill="url(#dots)"/>
  <circle cx="60" cy="40" r="120" fill="#313944" fill-opacity="0.25"/>
  <circle cx="640" cy="360" r="90" fill="#454F5F" fill-opacity="0.12"/>
  <ellipse cx="340" cy="250" rx="200" ry="140" fill="url(#glow)"/>

  <!-- Trajectoires -->
  <g stroke="#586679" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round">
    <path d="M190 132 C 230 160, 270 170, 305 182"/>
    <path d="M492 140 C 450 165, 410 172, 375 182"/>
  </g>

  <!-- Carte contact (gauche) -->
  <g transform="translate(118 70) rotate(-11)">
    <rect width="130" height="54" rx="10" fill="#313944" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="26" cy="27" r="13" fill="#586679"/>
    <circle cx="26" cy="23" r="4.5" fill="#BBC3CE"/>
    <path d="M18 34 a8 6 0 0 1 16 0" fill="#BBC3CE"/>
    <rect x="48" y="18" width="62" height="7" rx="3.5" fill="#A0ABBA"/>
    <rect x="48" y="31" width="42" height="6" rx="3" fill="#586679"/>
  </g>

  <!-- Carte clé / générateur (droite) -->
  <g transform="translate(436 84) rotate(9)">
    <rect width="130" height="54" rx="10" fill="#313944" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="13" y="14" width="26" height="26" rx="7" fill="#586679"/>
    <circle cx="23" cy="27" r="5" stroke="#D6DAE1" stroke-width="2.2"/>
    <path d="M27.5 27 H34 M31.5 27 v3.5" stroke="#D6DAE1" stroke-width="2.2" stroke-linecap="round"/>
    <text x="50" y="25" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#A0ABBA">k7#Qm!2x</text>
    <rect x="50" y="32" width="58" height="5" rx="2.5" fill="#454F5F"/>
    <rect x="50" y="32" width="46" height="5" rx="2.5" fill="#16a34a"/>
  </g>

  <!-- Carte mot de passe (en train d'entrer dans le coffre) -->
  <g transform="translate(278 132) rotate(-3)">
    <rect width="124" height="60" rx="10" fill="#F0F2F4"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#1E2329"/>
    <rect x="17.5" y="21" width="11" height="9" rx="2" fill="#F0F2F4"/>
    <path d="M19.5 21 v-2.5 a3.5 3.5 0 0 1 7 0 V21" stroke="#F0F2F4" stroke-width="1.8"/>
    <g fill="#313944">
      <circle cx="46" cy="23" r="3"/><circle cx="56" cy="23" r="3"/><circle cx="66" cy="23" r="3"/>
      <circle cx="76" cy="23" r="3"/><circle cx="86" cy="23" r="3"/><circle cx="96" cy="23" r="3"/>
    </g>
  </g>

  <!-- Coffre -->
  <g>
    <!-- ombre -->
    <ellipse cx="340" cy="338" rx="112" ry="9" fill="#0B0C0F" fill-opacity="0.5"/>
    <!-- pieds -->
    <rect x="258" y="318" width="26" height="14" rx="4" fill="#0B0C0F"/>
    <rect x="396" y="318" width="26" height="14" rx="4" fill="#0B0C0F"/>
    <!-- corps -->
    <rect x="240" y="180" width="200" height="146" rx="18" fill="url(#safeFront)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <!-- fente -->
    <rect x="286" y="173" width="108" height="12" rx="6" fill="#0B0C0F"/>
    <!-- porte -->
    <rect x="258" y="198" width="164" height="112" rx="12" fill="#313944" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <!-- charnières -->
    <rect x="250" y="214" width="8" height="18" rx="3" fill="#1E2329"/>
    <rect x="250" y="276" width="8" height="18" rx="3" fill="#1E2329"/>
    <!-- molette -->
    <circle cx="340" cy="254" r="34" fill="#1E2329"/>
    <circle cx="340" cy="254" r="26" fill="#454F5F" stroke="#8694A7" stroke-opacity="0.35" stroke-width="1.5"/>
    <g stroke="#A0ABBA" stroke-width="2" stroke-linecap="round">
      <path d="M340 222 v5"/><path d="M372 254 h-5"/><path d="M340 286 v-5"/><path d="M308 254 h5"/>
    </g>
    <g stroke="#586679" stroke-width="1.5" stroke-linecap="round">
      <path d="M362.6 231.4 l-3.5 3.5"/><path d="M362.6 276.6 l-3.5 -3.5"/>
      <path d="M317.4 276.6 l3.5 -3.5"/><path d="M317.4 231.4 l3.5 3.5"/>
    </g>
    <!-- trou de serrure -->
    <circle cx="340" cy="249" r="6" fill="#0B0C0F"/>
    <path d="M337 252 h6 l1.5 11 h-9 z" fill="#0B0C0F"/>
    <!-- poignée -->
    <rect x="398" y="236" width="8" height="36" rx="4" fill="#8694A7"/>
  </g>

  <!-- Badge sécurisé -->
  <g transform="translate(436 196)">
    <circle r="17" fill="#16a34a"/>
    <circle r="17" stroke="#1E2329" stroke-width="4"/>
    <path d="M-7 0.5 l4.5 4.5 l9 -9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
