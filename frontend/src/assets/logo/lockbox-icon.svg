<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Lockbox</title>
  <style>
    /* Favicon en thème clair : cadenas foncé. « svg:root » ne cible que le fichier affiché seul
       (onglet du navigateur) et jamais l'icône intégrée dans la page, qui reste claire sur fond sombre. */
    @media (prefers-color-scheme: light) {
      svg:root .lb-shackle { stroke: #586679; }
      svg:root .lb-body { fill: #1E2329; }
      svg:root .lb-detail { fill: #F0F2F4; }
    }
  </style>
  <path class="lb-shackle" d="M22.5 28V21.5a9.5 9.5 0 0 1 19 0V28" stroke="#A0ABBA" stroke-width="5" stroke-linecap="round"/>
  <rect class="lb-body" x="14" y="26" width="36" height="28" rx="7" fill="#F0F2F4"/>
  <rect class="lb-detail" x="14" y="33" width="36" height="2.5" fill="#1E2329"/>
  <circle class="lb-detail" cx="32" cy="42.5" r="3.6" fill="#1E2329"/>
  <path class="lb-detail" d="M30.4 44.5h3.2l0.8 4.5h-4.8z" fill="#1E2329"/>
</svg>
